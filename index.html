<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>맵스케치 · MapSketch — 약관 및 정책</title>
  <style>
    :root {
      --bg: #0B1020; --surface: #151B2E; --border: #25304A;
      --text: #EAEEF7; --text-secondary: #A8B2C7; --text-muted: #6B7691; --accent: #6EA8FE;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
        "Noto Sans KR", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    .wrap { max-width: 620px; margin: 0 auto; padding: 64px 24px 96px; }
    .app { font-size: 14px; color: var(--accent); font-weight: 600; letter-spacing: 0.3px; }
    h1 { font-size: 26px; margin: 8px 0 32px; font-weight: 700; }
    a.doc {
      display: block; background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px 22px; margin-bottom: 14px;
      text-decoration: none; color: var(--text); transition: border-color .15s;
    }
    a.doc:hover { border-color: var(--accent); }
    .doc .t { font-size: 17px; font-weight: 600; }
    .doc .d { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .doc .t .en { color: var(--text-secondary); font-weight: 400; font-size: 14px; }
    footer { margin-top: 48px; color: var(--text-muted); font-size: 13px; }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="app">맵스케치 · MapSketch</div>
    <h1>약관 및 정책 · Legal</h1>

    <a class="doc" href="./privacy-policy.html">
      <div class="t">개인정보처리방침 <span class="en">· Privacy Policy</span></div>
      <div class="d">수집하는 정보, 이용 목적, 제3자 처리, 보관·파기</div>
    </a>
    <a class="doc" href="./terms-of-use.html">
      <div class="t">이용약관 <span class="en">· Terms of Use</span></div>
      <div class="d">이용 조건, 프리미엄 결제, 책임의 제한, 준거법</div>
    </a>
    <a class="doc" href="./account-deletion.html">
      <div class="t">계정 및 데이터 삭제 <span class="en">· Account &amp; Data Deletion</span></div>
      <div class="d">계정과 모든 데이터를 삭제하는 방법</div>
    </a>

    <footer>
      com.mapsketch.app · <a href="mailto:ffan0811@gmail.com">ffan0811@gmail.com</a>
    </footer>
  </div>
</body>
</html>
